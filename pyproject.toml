[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spring-ai-alibaba-dataagent-python"
version = "0.2.1"
description = "Python functional reimplementation of Spring AI Alibaba DataAgent"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "DataAgent Python contributors" }]
dependencies = [
  "aiosqlite>=0.20,<1",
  "apscheduler>=3.10,<4",
  "bcrypt>=4.2,<6",
  "docker>=7.1,<8",
  "fastapi>=0.135,<1",
  "filelock>=3.16,<4",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "sqlglot>=26,<30",
  "tiktoken>=0.8,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
bi = ["duckdb>=1.4,<2", "pandas>=2.2,<3"]
connectors = [
  "asyncmy>=0.2.10,<1",
  "jaydebeapi>=1.2.3,<2",
  "oracledb>=2.5,<4",
  "psycopg[binary]>=3.2,<4",
  "pyhive>=0.7,<1",
  "pymysql>=1.1,<2",
  "pyodbc>=5.2,<6",
]
vector = [
  "elasticsearch[async]>=8.17,<10",
  "pymilvus>=2.5,<3",
]
local-rag = [
  "FlagEmbedding>=1.3.5,<1.4",
  "huggingface-hub>=0.34,<1",
  "scipy>=1.13,<2",
  "sentence-transformers>=5.1,<5.2",
  "torch>=2.5,<3",
  "transformers>=4.44,<5",
]
storage = ["oss2>=2.19,<3"]
observability = [
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
]
mcp = ["mcp>=2,<3"]
full = [
  "duckdb>=1.4,<2",
  "pandas>=2.2,<3",
  "FlagEmbedding>=1.3.5,<1.4",
  "asyncmy>=0.2.10,<1",
  "elasticsearch[async]>=8.17,<10",
  "jaydebeapi>=1.2.3,<2",
  "huggingface-hub>=0.34,<1",
  "mcp>=2,<3",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "oracledb>=2.5,<4",
  "oss2>=2.19,<3",
  "psycopg[binary]>=3.2,<4",
  "pyhive>=0.7,<1",
  "pymilvus>=2.5,<3",
  "pymysql>=1.1,<2",
  "pyodbc>=5.2,<6",
  "scipy>=1.13,<2",
  "sentence-transformers>=5.1,<5.2",
  "torch>=2.5,<3",
  "transformers>=4.44,<5",
]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
dataagent = "dataagent.main:run"
dataagent-mcp = "dataagent.mcp_server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/dataagent"]

[tool.hatch.build]
include = [
  "src/dataagent/**/*.py",
  "src/dataagent/prompts/*.txt",
  "src/dataagent/assets/*",
]

[tool.hatch.build.targets.sdist]
include = ["/src/dataagent", "/tests", "/README.md", "/.env.example"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.coverage.run]
source = ["dataagent"]
branch = true
