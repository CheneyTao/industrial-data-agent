[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-pdm-agent-source"
version = "2.1.0"
description = "Reproducible Industrial PdM source, synthetic demo data, NL2SQL, RCA and reports"
requires-python = ">=3.10"
dependencies = ["pandas", "numpy", "matplotlib", "PyMySQL", "mcp>=1.0,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
